<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/x-icon" href="assets/logoaba.ico">
</head>
<body>

<div id="login-screen">
  <div class="ledger-card">
    <div class="ledger-eyebrow">Acesso restrito</div>
    <h1>Login Controle Financeiro</h1>
    <p class="sub">Entre com seu e-mail e senha do Firebase Auth.</p>
    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label for="pwd">Senha</label>
        <input type="password" id="pwd" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
